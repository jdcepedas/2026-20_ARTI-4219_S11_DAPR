apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-subscriber
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-subscriber
  template:
    metadata:
      labels:
        app: order-subscriber
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "order-subscriber"
        dapr.io/app-port: "5001"
        
    spec:
      containers:
        - name: order-subscriber
          image: order-subscriber:latest
          imagePullPolicy: Never   # La imagen se carga localmente con `kind load`
          ports:
            - containerPort: 5001
